name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 (Required for AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Node Dependencies (Provides Capacitor Android Library)
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK Platform 36 & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK via Gradle
        working-directory: frontend/android
        run: |
          sed -i -e 's/\r$//' ./gradlew
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || {
            echo "::error title=Gradle Build Failure::$(tail -n 20 gradle-build.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "## Gradle Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare APK with Friendly Name
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/Smart-Expense-Tracker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Expense-Tracker-APK
          path: frontend/android/app/build/outputs/apk/debug/Smart-Expense-Tracker.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "Smart Expense Tracker v1.0.0 APK"
          body: |
            ### 📱 Cash & UPI Smart Expense Tracker (Android APK)
            Download and install directly on your Android device:
            - **Direct APK Download**: [Smart-Expense-Tracker.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Smart-Expense-Tracker.apk)
          files: |
            frontend/android/app/build/outputs/apk/debug/Smart-Expense-Tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: frontend/android/gradle-build.log
          retention-days: 7
