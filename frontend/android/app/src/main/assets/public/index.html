    <!-- Instant First-Frame Splash Styles (Zero Black Screen Delay) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

        justify-content: center;

      .pre-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 90%;
        max-width: 600px;
        text-align: center;
      }
      .pre-title {
        margin: 0;
        font-size: clamp(3rem, 7.5vw, 4.8rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #0f172a;
        line-height: 1.1;
        animation: preFadeIn 0.35s ease-out both;
      }
      .pre-swoosh {
        width: 100%;
        max-width: 520px;
        margin-top: 0.5rem;
        margin-bottom: 1.8rem;
        display: flex;
        justify-content: center;
      }
      .pre-swoosh svg {
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .pre-swoosh-path {
        stroke-dasharray: 480;
        stroke-dashoffset: 480;
        animation: preDraw 0.5s cubic-bezier(0.25, 1, 0.5, 1) 0.15s forwards;
      }
      .pre-swoosh-dot {
        transform-origin: 441px 11px;
        animation: preDot 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
      }
      .pre-subtitle {
        display: flex;
        justify-content: center;
        align-items: center;

        font-size: clamp(1.1rem, 2.4vw, 1.5rem);
        font-weight: 700;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        animation: preFadeIn 0.4s ease-out 0.4s both;
      }
      .pre-tagline {
        position: absolute;
        bottom: 2.5rem;
        left: 0;
        right: 0;
        margin: 0;
        font-size: clamp(0.85rem, 1.8vw, 1.05rem);
        color: #94a3b8;
        text-align: center;
        animation: preFadeIn 0.4s ease-out 0.6s both;
      }
      @keyframes preFadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes preDraw {
        from { stroke-dashoffset: 480; opacity: 0; }
        to { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes preDot {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.3); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
