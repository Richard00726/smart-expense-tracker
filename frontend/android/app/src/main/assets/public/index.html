  <body>
    <!-- Single Entrance Splash Screen (Plays Exactly Once) -->
    <div id="splash-screen" onclick="window.dismissSplash && window.dismissSplash()">
      <div class="pre-center">
        <h1 class="pre-title">Smart Expense</h1>
        <div class="pre-swoosh">
          <svg viewBox="0 0 460 48" fill="none">
            <defs>
              <linearGradient id="preSwooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00b894" />
                <stop offset="100%" stop-color="#00d68f" />
              </linearGradient>
            </defs>
            <path d="M 12 22 C 145 42, 315 42, 438 12" stroke="url(#preSwooshGrad)" stroke-width="5.5" stroke-linecap="round" class="pre-swoosh-path" />
            <circle cx="441" cy="11" r="6.5" fill="#00d68f" class="pre-swoosh-dot" />
          </svg>
        </div>
        <div class="pre-subtitle">
          <span>T</span><span>R</span><span>A</span><span>C</span><span>K</span><span>E</span><span>R</span>
        </div>
        <p class="pre-tagline" id="splash-tagline">Know where every rupee goes.</p>
      </div>
    </div>

    <script>
      (function() {
        try {
          var navEntries = performance.getEntriesByType && performance.getEntriesByType('navigation');
          var isReload = (navEntries && navEntries[0] && navEntries[0].type === 'reload') || (window.performance && window.performance.navigation && window.performance.navigation.type === 1);
          var hasOpened = sessionStorage.getItem('app_has_opened');
          var el = document.getElementById('splash-screen');
          
          if (isReload || hasOpened) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
            return;
          }
          sessionStorage.setItem('app_has_opened', 'true');
        } catch(e) {}

        var taglines = [
          "Know where every rupee goes.",
          "Track today. Save tomorrow.",
          "Simple spending, smarter savings.",
          "Every transaction counts, every rupee matters.",
          "Master your cash, conquer your bank.",
          "Spend with clarity, save with confidence.",
          "Your personal finance, beautifully organized."
        ];
        try {
          var idx = parseInt(localStorage.getItem('splash_tagline_idx') || '-1', 10);
          idx = (idx + 1) % taglines.length;
          localStorage.setItem('splash_tagline_idx', idx.toString());
          var tEl = document.getElementById('splash-tagline');
          if (tEl) tEl.textContent = taglines[idx];
        } catch(e) {}

        window.dismissSplash = function() {
          var el = document.getElementById('splash-screen');
          if (!el || el.classList.contains('fade-exit')) return;
          el.classList.add('fade-exit');
          setTimeout(function() {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 400);
        };

        // Automatically dismiss after 1.25s (animation completes smoothly)
        setTimeout(window.dismissSplash, 1250);
      })();
    </script>

    <div id="root"></div>
  </body>
